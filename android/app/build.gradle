plugins {
    id 'com.android.application'
}

apply from: file('../react-native-plugin.gradle')

ext {
    hermesEnabled = true
    react = [
        enableHermes: true
    ]
}

android {
    namespace 'com.nanodata.armsx'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'com.nanodata.armsx'
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '0.1.0'
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            matchingFallbacks = ['release']
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            java.srcDirs += ['../../third_party/SDL/android-project/app/src/main/java']
            res.srcDirs += ['src/main/res', '../../third_party/SDL/android-project/app/src/main/res']
            assets.srcDirs += ['src/main/assets']
            jniLibs.srcDirs += ['src/main/jniLibs']
        }
    }
}

react {
    root = file('..')
    reactNativeDir = file('../node_modules/react-native')
    cliFile = file('../node_modules/react-native/cli.js')
    entryFile = file('../mobile/index.js')
}

def nativeModulesAppGradle = file('../node_modules/@react-native-community/cli-platform-android/native_modules.gradle')
if (nativeModulesAppGradle.isFile()) {
    apply from: nativeModulesAppGradle
    applyNativeModulesAppBuildGradle(project)
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.facebook.react:react-android:0.76.0'
    implementation 'com.facebook.react:hermes-android:0.76.0'
}

def repoRootDir = rootProject.projectDir.parentFile
def nativeOutput = file("$projectDir/src/main/jniLibs/arm64-v8a/libarmsx.so")

tasks.register("prepareNativeBinaries") {
    group = "native"
    description = "Build SDL2/libarmsx via build.sh android."
    inputs.file(new File(repoRootDir, "build.sh"))
    outputs.file(nativeOutput)
    doLast {
        exec {
            workingDir repoRootDir
            commandLine "./build.sh", "android"
        }
    }
}

preBuild.dependsOn(tasks.named("prepareNativeBinaries"))
